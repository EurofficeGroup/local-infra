# Local RabbitMQ for Power / Noodles (NServiceBus).
# Mounted into /etc/rabbitmq/conf.d/10-local.conf

# Keep the broker from growing: 60% of the container mem_limit.
# Above that RabbitMQ applies back-pressure instead of being OOM-killed.
vm_memory_high_watermark.relative = 0.6

# Low disk threshold so it never blocks publishing locally.
disk_free_limit.absolute = 500MB

# By default 'guest' may only connect from localhost; inside a container the
# connection arrives from the host network, so lift the restriction (local only).
loopback_users = none

# Log to stdout - visible via `docker compose logs rabbit`
log.console = true
log.console.level = info
log.file = false
