# ======================================================================
# EurofficeGroup - local infrastructure, part 1 of 3: group "power"
#
# Docker Desktop shows one group per compose project, so the stack is split
# into three files, one project each:
#
#   docker-compose.yml          power      mssql, rabbit, redis, mailpit (+ search)
#   docker-compose.api.yml      api-power  config-api + satellite APIs
#   docker-compose.noodles.yml  noodles    the sixteen Noodles services
#
# They share the external network "hostnet" (created by this file), so the
# container names resolve across all three. Start order: power, then
# api-power (config-api), then noodles - setup-local.bat does it for you.
#
#   docker compose up -d                      # core: mssql, rabbit, redis, mailpit
#   docker compose --profile search up -d     # + Elasticsearch/Kibana
#   docker compose -f docker-compose.api.yml up -d config-api
#   docker compose -f docker-compose.api.yml up -d                  # config-api + APIs
#   docker compose -f docker-compose.noodles.yml up -d [noodles-sales ...]
#
# All memory/CPU limits live in .env; MSSQL_SA_PASSWORD lives in .env.local
# (see .env.local.example). Bat scripts set COMPOSE_ENV_FILES=.env,.env.local.
# ======================================================================

# Project name = the group shown in Docker Desktop.
name: power

networks:
  hostnet:
    name: hostnet

volumes:
  rabbit-data:
  redis-data:
  mssql-data:
  elastic-data:

services:

  # ------------------------------------------------------------------
  # RabbitMQ - local replacement for Azure Service Bus (NServiceBus transport)
  # Power  : appSettings "Rabbit" = "host=localhost", "UseAzureServiceBus" = "false"
  # Noodles: transport settings come from the Configuration API
  # UI     : http://localhost:15672  (guest / guest)
  # ------------------------------------------------------------------
  rabbit:
    container_name: rabbit
    image: rabbitmq:3.13-management
    hostname: rabbit-local
    restart: unless-stopped
    ports:
      - "${RABBIT_PORT}:5672"
      - "${RABBIT_UI_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
      RABBITMQ_DEFAULT_VHOST: /
      # The Erlang scheduler busy-waits by default, which parks an idle broker
      # at whatever CPU allowance it is given. These flags turn that off; it
      # costs a little latency, which is irrelevant on a dev box.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+sbwt none +sbwtdcpu none +sbwtdio none"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-local.conf:ro
    networks: [hostnet]
    mem_limit: ${RABBIT_MEM}
    mem_reservation: ${RABBIT_MEM_RES}
    cpus: ${RABBIT_CPUS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s


  # ------------------------------------------------------------------
  # Redis - local cache
  # Power: appSettings "Cache" / "Redis.ConnectionString" = "localhost:6379,allowAdmin=true"
  # databases=36000 - same as power/docker-compose.yml (per-dealer multitenancy)
  # ------------------------------------------------------------------
  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --databases ${REDIS_DATABASES}
      --maxmemory ${REDIS_MAXMEMORY}
      --maxmemory-policy allkeys-lru
      --appendonly no
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    networks: [hostnet]
    mem_limit: ${REDIS_MEM}
    mem_reservation: ${REDIS_MEM_RES}
    cpus: ${REDIS_CPUS}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5


  # ------------------------------------------------------------------
  # Mailpit - catches all outgoing mail, nothing leaves the machine
  # SMTP: localhost:1025 (no auth)    UI: http://localhost:8025
  # For Noodles.Email / Power email sending
  # ------------------------------------------------------------------
  mailpit:
    container_name: mailpit
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${SMTP_PORT}:1025"
      - "${MAILPIT_UI_PORT}:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks: [hostnet]
    mem_limit: ${MAILPIT_MEM}
    mem_reservation: ${MAILPIT_MEM_RES}
    cpus: ${MAILPIT_CPUS}


  # ------------------------------------------------------------------
  # SQL Server - core, not optional.
  #
  # Every EO service reads its settings from the Configuration API, and the
  # Configuration API reads them from dbo.cfg_Configurations in a support centre
  # database here. Nothing starts without it.
  #
  # The TEST4 backups (test4_power_*.bak) are restored as dev_uk_* -
  # INFRA_DB_PREFIX / INFRA_BACKUP_PREFIX / INFRA_DEALER_CODE in .env,
  # see sql/test4/README.md.
  # ------------------------------------------------------------------
  mssql:
    container_name: mssql
    image: ${MSSQL_IMAGE}
    restart: unless-stopped
    user: root
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB}
      MSSQL_AGENT_ENABLED: "true"
    ports:
      - "${MSSQL_PORT}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./sql/init:/init:ro
      - ./sql/backup:/backup
    networks: [hostnet]
    mem_limit: ${MSSQL_MEM}
    mem_reservation: ${MSSQL_MEM_RES}
    cpus: ${MSSQL_CPUS}
    healthcheck:
      # works on both images: tools18 (2022) if present, tools (2019) otherwise
      test: ["CMD-SHELL", "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1') || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s


  # ==================================================================
  # Profile: search - Elasticsearch + Kibana
  # Version 7.9.2 - same as power/Docker-builds/Elastic/docker-compose.yml
  # ==================================================================
  elastic:
    profiles: ["search", "all"]
    container_name: elastic
    image: docker.elastic.co/elasticsearch/elasticsearch:7.9.2
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=false
      - "ES_JAVA_OPTS=-Xms${ELASTIC_HEAP} -Xmx${ELASTIC_HEAP}"
      - xpack.security.enabled=false
    ports:
      - "${ELASTIC_PORT}:9200"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    networks: [hostnet]
    mem_limit: ${ELASTIC_MEM}
    mem_reservation: ${ELASTIC_MEM_RES}
    cpus: ${ELASTIC_CPUS}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s


  kibana:
    profiles: ["search", "all"]
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:7.9.2
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elastic:9200
    ports:
      - "${KIBANA_PORT}:5601"
    depends_on:
      elastic:
        condition: service_healthy
    networks: [hostnet]
    mem_limit: ${KIBANA_MEM}
    mem_reservation: ${KIBANA_MEM_RES}
    cpus: ${KIBANA_CPUS}
